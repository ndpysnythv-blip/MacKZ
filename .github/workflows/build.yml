name: Build & Release

# 触发方式：
#   1) 推送 v* 标签（如 v1.1.0）→ 自动构建并发布 Release（含 MacKZ.zip）
#   2) 手动运行（Actions 页面 → Run workflow）→ 只上传构建产物，不发 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 = Apple Silicon 运行器；铰链角度传感器只存在于 M 系列机型，故只出 arm64
    runs-on: macos-14
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          swiftc --version
          echo "ARCH=$(uname -m)"

      - name: 编译并打包 MacKZ.app
        run: ARCH=arm64 ./build.sh

      - name: 压缩为 zip（ditto 可保留 bundle 权限与签名结构）
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MacKZ.app MacKZ.zip
          shasum -a 256 MacKZ.zip | tee MacKZ.zip.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MacKZ-app
          path: |
            build/MacKZ.zip
            build/MacKZ.zip.sha256

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MacKZ.zip
            build/MacKZ.zip.sha256
          generate_release_notes: true
          body: |
            # MacKZ · MacBook 铰链开合全局动画插件

            > 作者 **KDXZHX** · 产品页 <https://kdxzhx.top/mackz> · 开源免费

            读取 MacBook 屏幕转轴的真实开合角度，在你当前的桌面画面上实时叠加一段
            iPhone Duo 折叠屏风格的过渡动画：合上屏幕，桌面就像被折起来一样收走。

            ---

            ## 本次更新（v1.7.9）

            - **配对区块内联进介绍页**：<https://kdxzhx.top/mackz> 里新增「手机遥控配对」卡片
              （顶部导航也加了入口），不再单独开页面。Mac 面板点「打开配对页」直接跳到该区块，
              连接码随 `#c=` 片段带过去，打开即可看到大号连接码与二维码。
            - 手机连同一个 Wi-Fi，扫码或粘贴连接码配对后直达控制页。
            - 说明：官网只做配对入口 —— 浏览器禁止 https 页面直接请求局域网 http 服务（混合内容），
              所以真正的控制页仍由 Mac 本地提供，配对区负责把手机「送」过去。

            ## v1.7.8

            - 新增「官网配对页」连接手机（v1.7.9 起改为内联在介绍页里的配对区块）；
              连接码改为 `192.168.1.5:52800#836291`（Mac 地址 + 本次口令），口令改成 6 位纯数字。

            ## v1.7.7

            - **彻底回到纯 HTTP，不再弹钥匙串授权框（重要）**：v1.7.6 为了手机陀螺仪改用自签证书 HTTPS，
              而导入 PKCS#12 会把私钥写进「登录钥匙串」—— 每次启动都会弹钥匙串授权框，
              而且授权等待卡在主线程上，表现就是整个 App 冻住、拒不掉也关不掉。
              现在服务固定纯 HTTP，完全不碰钥匙串；代价是 iOS 不再允许 http 页面读运动传感器，
              即手机陀螺仪模式不可用（遥控按钮、进度滑块照常可用）。
            - **按钮外观改回系统原生**：此前给弹窗与设置面板的按钮强加了 12pt 字号与自定义样式，
              显得又小又别扭；现在全部交回系统默认外观。
            - **「更多介绍」折叠链接**：手机遥控下面那串长说明，标题从一句话长文改成
              一行蓝色链接「更多介绍」，点击才展开；折叠区也不再套圆角背景框。
            - 说明文案同步更新：HTTPS / 证书相关的排查步骤已替换为纯 HTTP 的排查步骤。

            ## v1.7.6

            - 手机遥控重新固定走 HTTPS（针对 Safari「仅限 HTTPS」报错），自签证书按标准服务器证书签发；
              PKCS#12 导出改为逐组参数尝试。**该方案在 v1.7.7 已整体撤销**（会弹钥匙串授权框）。

            ## v1.7.5

            - **修复弹窗按钮点不动（重要）**：之前弹窗用的是 NSAlert，而本应用没有 Dock 图标，
              macOS 14 起无法无条件抢焦点 —— 后台弹出的窗口第一次点击会被系统拿去「激活应用」而送不到按钮上，
              而且模态会话会一直挂着，导致设置面板等其它窗口也一起失去响应。
              现在所有弹窗/提示都换成自绘的非激活面板（nonactivatingPanel + 按钮接受首次点击、非模态），
              点一次就生效，也不会再把 App 卡住。
            - **录屏权限流程理顺，去掉来回弹窗**：点「申请授权」只申请权限本身，不再顺带弹出「修复权限」对话框
              （两个弹窗互相调用会来回循环）；「修复权限」只在点它时才执行：清记录 → 提示 → 重新申请一次。
              tccutil 移到后台线程执行，避免界面假死。
            - **手机遥控默认回到 HTTP**：读陀螺仪才需要 HTTPS，而自签证书在手机上必然先弹「证书不受信任」，
              所以默认用兼容性最好的 HTTP；需要陀螺仪时打开「陀螺仪模式（HTTPS）」开关即可。
            - **「刷新地址」修好了**：之前点它只刷新显示文字，并没有重新监听；现在会重新读局域网 IP 并换一个新口令。
            - 手机遥控面板精简：删掉「在本机打开 / 重新检测连接 / 打开本地网络设置」三个按钮，
              长说明收进可折叠的「使用说明 / 打不开时的排查」。

            ## v1.7.4

            - **下载提速：多源自动切换**。以前只从 GitHub 直链下载，国内网络经常超时（网络错误 -1001）。
              现在会依次尝试「GitHub 直连 → 5 个加速节点」，某个源 15 秒连不上就自动换下一个，
              全部走完还会整体重来一轮；进度文字里会显示当前用的是哪条通道。
              下载完还会校验文件头是不是 zip，防止加速节点返回错误页把 App 换坏。
            - **修复更新弹窗按钮点不动**：没有 Dock 图标的 App 在后台弹窗时，
              第一次点击会被系统拿去「尝试激活应用」而送不到按钮上，看起来就是怎么点都没反应。
              现在弹窗/进度框出现时会临时切换到普通 App 抢到焦点，弹完立刻切回菜单栏模式；
              「取消」按钮也改为接受首次点击。
            - **更新进度框右下角新增作者 logo 与 KDXZHX 署名**。

            ## v1.7.3

            - **手机遥控连不上时能直接看到卡在哪**：启动后自动自检「本机回环 + 局域网」两段路径，
              结论写在设置面板状态行；手机打不开时点「重新检测连接」即可复检。
              新增「打开本地网络设置」直达按钮 —— macOS 15 起不授权「本地网络」，手机就连不上 Mac。
            - **HTTPS 自检不通过会自动回退 HTTP**：避免手机端出现「打不开该网页，因为已丢失网络连接」。
            - **菜单栏图标从 20pt 缩到 18pt**，与旁边系统图标齐平。
            - **接入官网**：菜单栏、设置面板、更新弹窗都新增「打开官网」入口，统一指向 <https://kdxzhx.top/mackz>。

            ## v1.7.2

            - **手机陀螺仪铰链模式（新功能）**：没有 Lid Angle Sensor 的机型（如 MacBook Air）现在可以把手机
              竖着贴/绑在屏幕上，用手机姿态角模拟 MacBook 铰链开合 —— 手机页面点「启用陀螺仪」后，
              角度会以 20Hz 推给 Mac，直接驱动折叠动画；数据中断会自动交还本机传感器。
            - **手机遥控改走 HTTPS**：浏览器读取运动传感器必须处于安全上下文，因此服务会用系统自带的
              openssl 现场签一张含本机 IP 的自签证书（手机首次打开点「继续访问」即可），
              拿不到证书时自动回退 HTTP；同时把连接改为 keep-alive，避免 20Hz 上报反复做 TLS 握手。
            - **修复菜单栏图标两侧的黑边**：旧算法把等比缩放留下的透明留白（亮度 0）算成了不透明的黑色，
              表现为 logo 左右各挂一条黑边；现在只保留纯 logo 本身。
            - **更新弹窗不再被压住**：弹窗/进度窗层级统一提高到 3000（高于覆盖动画层与设置面板），
              并在模态期间二次压层 + 强制激活本应用，解决「弹窗老在下面」的问题。

            ## v1.7.1

            - **菜单栏图标更醒目、白边消失**：原 logo 是白底深色图形且四周留白很大（图形只占约 55%），
              放进菜单栏就是一个显眼的小白方块。现在会自动定位图形外接框、裁掉四周留白、把白底刷成透明，
              图形视觉上放大约 1.8 倍；图标尺寸从 18pt 提到 20pt，并设为模板图，
              浅色菜单栏显示黑色字形、深色菜单栏由系统自动反白。

            ## v1.7.0

            - **新增手机遥控**：手机连同一个 Wi-Fi，用浏览器打开插件里显示的地址，
              即可远程「合上 / 打开 / 播放一次开合 / 拖动进度」，主要用于给别人演示；
              服务只监听局域网，带随机口令，关掉开关即完全停止。
            - **接入作者 logo**：`Resources/logo.jpg` 由 `build.sh` 自动转换为 `AppIcon.icns`，
              同时作为菜单栏图标（取不到时回退为代码绘制的 KZ 字样），`Info.plist` 版权署名更新为 KDXZHX。
            - **设置面板按新手优先重排**：实时状态 → 总开关 → 权限 → 手机遥控 → 常用设置，
              角度标定与采集性能等细节收进底部可折叠的「高级设置」，新手只需面对最上面几块。
            - **模拟动画放慢到 2.2 秒**，且「模拟合上 / 模拟打开」支持反复点击。
            - **折叠方向默认「向下收」**：铰链在屏幕顶边、内容折向屏幕下方，更符合 MacBook 观感；
              需要参考实现的原始方向时可在设置里切回「向上收」。
            - **更新弹窗不再被遮挡**：层级提到 2000 并加入所有空间，全屏 App 上也能弹出。
            - **新增「合盖不休眠」开关**：解决合盖休眠 + 锁屏把开合动画吞掉的问题（需一次性管理员授权）。
            - 安装脚本改为抗假死版本：优先整包下载、多镜像回退、带 `--max-time` 与低速超时保护。

            ---

            ## 安装方式一：终端一键安装（推荐）

            不需要浏览器下载，也不需要处理“不受信任的开发者”提示——脚本在你本机拉源码、
            本机编译、本机签名，产物天生带信任。

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ndpysnythv-blip/MacKZ/main/scripts/install-raw.sh | bash
            ```

            脚本会自动：检查 Xcode 命令行工具 → 下载源码（多镜像 + 超时保护）→ 编译 MacKZ.app
            → 装入「应用程序」→ 配置开机自启 → 启动，并顺带清理更新后残留的旧授权记录。

            ## 安装方式二：下载本页的 MacKZ.zip

            浏览器下载的文件一定带 `com.apple.quarantine` 隔离属性，未公证的应用会被 Gatekeeper 拦下
            （系统设置里可能连“仍要打开”都不出现）。解压拖进「应用程序」后执行：

            ```bash
            sudo xattr -cr /Applications/MacKZ.app
            sudo codesign --force --deep --sign - /Applications/MacKZ.app
            open /Applications/MacKZ.app
            ```

            ---

            ## 使用

            1. 菜单栏出现 MacKZ logo 图标 → 点「设置…」调参（所有参数都可热生效，无需重启）；
            2. 首次启动会自动申请「屏幕录制」权限，授权后程序自动重启生效；
               若系统设置里已勾选却仍显示未授权（更新后常见），点设置里的「修复权限」清掉过期记录再授权一次；
            3. 慢慢合上屏幕即可看到动画；中途停手会自动加速播完剩余片段，
               反向抬起会立即取消加速、继续跟随；
            4. 想让开盖也看得到动画：设置面板 →「合盖与休眠」→「开启合盖不休眠」。

            ## 环境要求

            | 项目 | 要求 |
            | --- | --- |
            | 系统 | macOS 14.0 Sonoma 及以上 |
            | 芯片 | Apple Silicon（M 系列）。Intel 机型无铰链传感器，只能用手动预览 |
            | 依赖 | Xcode Command Line Tools（脚本会引导安装） |
            | 权限 | 「屏幕录制」 |

            ## 更新与卸载

            - 更新：菜单栏 →「检查更新…」，发现新版本会自动弹窗，一键下载替换并重启。
            - 卸载：`rm -rf /Applications/MacKZ.app ~/Library/LaunchAgents/com.mackz.plugin.plist`
            - 反馈：<https://github.com/ndpysnythv-blip/MacKZ/issues>
