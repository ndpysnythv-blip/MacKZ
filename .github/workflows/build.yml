name: Build & Release

# 触发方式：
#   1) 推送 v* 标签（如 v1.1.0）→ 自动构建并发布 Release（含 MacKZ.zip）
#   2) 手动运行（Actions 页面 → Run workflow）→ 只上传构建产物，不发 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 = Apple Silicon 运行器；铰链角度传感器只存在于 M 系列机型，故只出 arm64
    runs-on: macos-14
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          swiftc --version
          echo "ARCH=$(uname -m)"

      - name: 编译并打包 MacKZ.app
        run: ARCH=arm64 ./build.sh

      - name: 压缩为 zip（ditto 可保留 bundle 权限与签名结构）
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent MacKZ.app MacKZ.zip
          shasum -a 256 MacKZ.zip | tee MacKZ.zip.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MacKZ-app
          path: |
            build/MacKZ.zip
            build/MacKZ.zip.sha256

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MacKZ.zip
            build/MacKZ.zip.sha256
          generate_release_notes: true
          body: |
            # MacKZ · MacBook 铰链开合全局动画插件

            > 作者 **KDXZHX** · 产品页 <https://kdxzhx.top/mackz> · 开源免费

            读取 MacBook 屏幕转轴的真实开合角度，在你当前的桌面画面上实时叠加一段
            iPhone Duo 折叠屏风格的过渡动画：合上屏幕，桌面就像被折起来一样收走。

            ---

            ## 本次更新（v1.16.0）

            - **修「手机显示已连接、Mac 一直显示中转连接中」的真正原因**：Mac 端以前在 WebSocket
              握完手之前就把 MQTT CONNECT 发了出去，报文被丢、又收不到 CONNACK，界面就永远停在
              「中转连接中…」；现在改到握手完成的回调里才发。手机端以前多个 socket 共用一个
              MQTT 会话，会把 CONNECT 重发到已握手的 socket 上（协议违规，broker 直接踢连接），
              现在每条 socket 各跑一条独立会话。
            - **两端都同时连全部候选中转**：任一条重合即可互通，重复消息 120 毫秒去重。
            - **面板排版**：二维码与左侧按钮同排，右上角不留空白。

            ## v1.15.0

            ## v1.14.1

            - **修「二维码一直刷新」**：配对链接不再含会变化的中转下标，二维码稳定不闪。
            - **手机端同时连所有候选中转**：任一条通即可用，Mac 在哪个中转上都能互通，不用重新扫码。
            - 二维码放大到 92px。

            ## v1.14.0

            - **修「手机显示已连接、Mac 一直连不上中转」**：两端共用一份中转候选列表，Mac 连不上自动换下一个，
              并把当前下标写进配对链接，手机照它连同一个，保证两端一致。
            - **设置面板排版规整**：所有分区等宽；「折叠动画」提到「手机遥控」之前；二维码缩小并挪到按钮右侧；
              陀螺仪按钮收成一行。
            - **两个动画改名**：「玻璃折叠」/「画面外扩」。

            ## v1.13.0

            - **第二个动画改成 1:1 照搬 MacDuo 的 Duo**（DhananjayBhosale/MacDuo，MIT）：几何、模糊 sigma、
              边缘羽化、压暗、末段渐隐全部按原公式与默认参数落地，锚点就是它原版的「屏幕底边中心」。

            ## v1.12.2

            - **修第二个动画方向反了**：改成「收缩」—— 画面整体变小并朝锚点滑进去，正向锚点在**左下角**
              （画面往左下角缩）、反方向在右下角；模糊/压暗/渐隐同步跟随锚点。

            ## v1.12.1

            - **修「第二个动画切换折叠方向没反应」**：角落锚点样式现在会读「折叠方向」并做左右镜像 ——
              正向＝左下角锚点，反方向＝右下角锚点，模糊基准同步镜像。

            ## v1.12.0

            - **第二个动画重做为「iPhone Duo 同款」**（参考 MacDuo）：改用它的 Duo 那套**膨胀逆映射** ——
              围绕锚点膨胀（锚点附近几乎不动、越远的内容被推得越远并移出画面），配随距离增长的模糊、
              压暗与完全合上时的整体渐隐；锚点按需要放在**左下角**，画面往左下方向移走。

            ## v1.11.1

            - 动画起点角默认值补齐为 130°（特效全程跟随开合角）。

            ## v1.11.0

            - **特效改为「全程跟随开合角」**（对齐 iPhone Duo / Mac Duo 的观感）：动画起点角默认由 90° 改为
              **130°（完全打开）**，从完全打开往下合就**立刻**开始变柔、向外扩张并围绕铰链消失，
              一路连续跟随到完全合上（旧版合到 90° 以下才开始，前 40° 什么都不发生）。
              老配置会自动纠正一次，设置里也能手动调。

            ## v1.10.3

            - **设置面板极简改版**：删掉所有长篇说明，顶部状态/总开关/权限合并成一块，分区标题与按钮文案精简。
            - **改动即时生效**：去掉「保存并应用」「放弃修改并重载」按钮 —— 开关/下拉/卡片点一下立刻生效，
              滑块拖动做 0.3 秒防抖。

            ## v1.10.2

            - **重做「左下角收起」动画**：上一版是「整屏纯缩放 + 平移」，与折叠完全不是一回事。
              现在改成**斜轴透视折叠**：沿用参考实现（DuoHinge）的射线投射，把虚拟铰链轴换成
              「过右上角、沿左上—右下对角线」的斜轴，桌面被折向**左下角**收走。
            - **修「发现新版本时只看得到标题，看不到更新内容」**：更新日志滚动区在 `NSStackView` 里没有
              固有尺寸、高度被压成 0，现在固定宽高并按 NSTextView + NSScrollView 标准配置设置。
            - **折叠方向修正为参考实现（DuoHinge）方向**：原项目以屏幕底边为铰链、内容折向键盘侧收走。

            ## v1.10.1

            - **修「发现新版本时只看得到标题，看不到更新内容」**：更新日志滚动区在 `NSStackView` 里没有
              固有尺寸、高度被压成 0，现在固定宽高并按 NSTextView + NSScrollView 标准配置设置，
              Markdown 标记也做了清理，更新内容能直接看。
            - **折叠方向修正为参考实现（DuoHinge）的方向**：原项目以屏幕底边为铰链、内容折向键盘侧收走，
              此前默认的「铰链在顶边」正好反了；老配置自动纠正一次，也可在设置里手动切换。

            ## v1.10.0

            - **新增第二种折叠动画「左下角收起」**：设置面板「常用设置」最上面多了一行「折叠动画」，
              做成两个可点选的框 —— ① 上下折叠（原来的玻璃折叠）② 左下角收起（整屏缩小并往左下角滑走）。
              点一下立即切换，点「保存并应用」落盘。

            ## v1.9.9

            - **第 3 步改成「路径学习」**：不用再合到底，往下合过 40° 就够 —— 实时采样原始角的变化方向，
              自动判断手机是正向贴还是反向贴（贴反了自动镜像）。
            - **修「没开到 130° 动画就自动停住」**：两点线性换算在合上端采错时会拉伸斜率，导致提前归零；
              现在斜率恒为 1:1（手机测的就是屏幕平面与水平面的夹角）只做平移，遗留的错误数据自动清除。
            - **手机驱动时全程都有动画**：0°~130° 全行程线性映射，掀到最大才刚好播完。
            - **必须完成引导才接管**：手机点「启用陀螺仪」后手机页显示「请在 Mac 端完成操作」，
              走完引导点「开始使用」才驱动动画。

            ## v1.9.8

            - **引导改成三步**：① 固定手机（不用再合屏幕）② 掀到最大标记 130° ③ 慢慢合到底，
              程序自动学习「完全合上」参考点（合到底屏幕已黑、点不到按钮，这一步不用点任何东西）。
              两点一算就能按 0°~130° 推算全角度，动画不再偏快偏慢。
            - **修「每次启用手机陀螺仪都要走一遍引导」**：标定与引导记录一起落盘，走过一次就不再自动弹。
            - **重画引导示意动画**：MacBook 侧视图（底座在右、铰链在左后方，屏幕向上掀开），
              手机画在屏幕背面；第 3 步演示「合到底」动作，右下角实时标注角度。
            - **状态行更直观**：同时显示「手机原始角 → 换算后的铰链角」。

            ## v1.9.7

            - **修「手机横着贴上去完全没有动画」**：开合角改用重力在手机屏幕法线（z 轴）上的投影计算，
              只看屏幕平面与水平的夹角 —— 横放、竖放都不影响（老公式只认竖放，横着贴角度根本不变）。
            - **修引导弹窗里画反的开合动画**：改成显式三角函数绘制，屏幕是绕底座后方铰链「向上掀开」。
            - **标定结果落盘**：标过一次之后不再自动弹引导，不用每次启用都重标。

            ## v1.9.6

            - **标定只标「完全打开」一个点**：合上时屏幕全黑、点不到按钮，所以取消「标定完全合上」；
              0° 那端由 MacBook 固定的开合尺度推算。引导第 1 步只确认手机已贴稳并在报数。
            - **「退出手机陀螺仪」同时复位画面**：一键收掉折叠覆盖层、回到正常桌面并交回本机传感器。

            ## v1.9.5

            - **修「手机陀螺仪连上了，屏幕开合却没有动画」**：去掉「必须先走完引导才接管」的限制，
              手机点了「启用陀螺仪」就直接驱动动画，引导只负责把标定做准。
            - **新增「退出手机陀螺仪」按钮**：一键停止手机驱动、交回本机铰链传感器。
            - **两点标定防呆**：两次位置差 < 15° 直接拦下提示重做（误标定会让角度被放大到离谱）。

            ## v1.9.4

            - **修「才合上一点点，动画就播完了」**：手机陀螺仪驱动时不再触发「停顿 → 加速补完」，
              停在哪就是哪（之前中途停一下会被当成「已经合到底」直接补到结尾）。
            - **修「打开过程卡顿」**：折叠跟随改为 60Hz 缓动追帧，进度按时间平滑逼近，不再一帧一跳。
            - 手机陀螺仪上报频率 20Hz → 50Hz，平滑改为与输入频率无关的时间常数式。

            ## v1.9.3

            - **手机陀螺仪改成「跟着引导走」**：手机端点「启用陀螺仪」只获取权限并提示「剩下的请在 Mac 上操作设置」，
              授权后先不接管动画；Mac 收到手机角度会自动弹出引导弹窗。
            - Mac 引导弹窗（带动画示意）：① 请先把手机固定在 Mac 屏幕上 → ② 请将 Mac 屏幕开合到最大 →
              ③ 已设置完成，开始使用吧。两步记下 0° 与 135° 两个基准点，手机没放稳会被拦下并提示。
            - 手机控制页新增「等待 Mac 设置 / 接管中」状态。

            ## v1.9.2

            - **手机陀螺仪标定搬到 Mac 设置面板**：手机贴在屏幕上时看不到手机画面，标定按钮在手机上点不到，
              所以「当前位置＝完全合上」「当前位置＝完全打开」「复位标定」都放在「手机遥控」区里。
            - **放稳确认**：面板实时显示手机姿态与晃动幅度，没放稳时标定按钮是灰的；标定后显示映射关系。
            - 手机控制页去掉自带零点标定，改为上报原始姿态角（标定统一在 Mac 端做）。

            ## v1.9.1

            - **设置面板的配对二维码改小**（168 → 100 px），不再占满一整行。

            ## v1.9.0

            - **手机配对页改成两级**：配对成功那一屏只留一个 **「进入控制中心」** 按钮，
              点进去才是原来的遥控界面（合上 / 打开 / 播放一次 / 拖进度 / 陀螺仪），
              底部可「← 返回配对页」；配对页本身只显示连接码、二维码与连接状态。
            - **一进官网不再停在首页顶部**：带连接码打开、手动配对、进 / 出控制中心都会自动滚到
              「手机遥控配对」区块，打开就能看到配对结果。
            - **Mac 设置面板里直接显示配对二维码**（连接码一变自动刷新），不用再去官网页面找；
              二维码图片接口按 pwmqr → qrserver 依次降级，都不可用时退回文字提示 + 连接码手输。

            ## v1.8.0

            - **手机遥控改成「手机全程在官网上操作」**：手机打开 <https://kdxzhx.top/mackz>，
              输入 Mac 面板上的 8 位连接码配对，之后合上 / 打开 / 播放一次 / 拖进度、以及
              **陀螺仪铰链模式**都在这个网页上完成。手机和 Mac 甚至不必在同一个 Wi-Fi。
            - 为什么必须这样绕：iOS 只在 https 页面才开放运动传感器，而 https 页面被浏览器禁止
              直接请求局域网的 http 服务（混合内容）。所以改成 **Mac 主动连出去**——
              两端在一个公共中转（MQTT over WebSocket）上对话，房间号就是那次随机生成的连接码，
              只传指令和角度数字；官网不存任何数据，也不需要自建服务器。
            - Mac 端不引入任何第三方库：WebSocket 交给 URLSessionWebSocketTask，MQTT 报文自己拼；
              断线 5 秒退避重连，连接状态直接显示在设置面板。
            - 原来的局域网直连页保留为备用路径（中转不通时同一 Wi-Fi 下仍可控制，但没有陀螺仪）。
            - 介绍页右上角新增「手机遥控」入口，配对区块升级成完整控制台（含二维码）。

            ## v1.7.9

            - 配对区块内联进介绍页（v1.8.0 起升级为官网控制台）。

            ## v1.7.7

            - **彻底回到纯 HTTP，不再弹钥匙串授权框（重要）**：v1.7.6 为了手机陀螺仪改用自签证书 HTTPS，
              而导入 PKCS#12 会把私钥写进「登录钥匙串」—— 每次启动都会弹钥匙串授权框，
              而且授权等待卡在主线程上，表现就是整个 App 冻住、拒不掉也关不掉。
              现在服务固定纯 HTTP，完全不碰钥匙串；代价是 iOS 不再允许 http 页面读运动传感器，
              即手机陀螺仪模式不可用（遥控按钮、进度滑块照常可用）。
            - **按钮外观改回系统原生**：此前给弹窗与设置面板的按钮强加了 12pt 字号与自定义样式，
              显得又小又别扭；现在全部交回系统默认外观。
            - **「更多介绍」折叠链接**：手机遥控下面那串长说明，标题从一句话长文改成
              一行蓝色链接「更多介绍」，点击才展开；折叠区也不再套圆角背景框。
            - 说明文案同步更新：HTTPS / 证书相关的排查步骤已替换为纯 HTTP 的排查步骤。

            ## v1.7.6

            - 手机遥控重新固定走 HTTPS（针对 Safari「仅限 HTTPS」报错），自签证书按标准服务器证书签发；
              PKCS#12 导出改为逐组参数尝试。**该方案在 v1.7.7 已整体撤销**（会弹钥匙串授权框）。

            ## v1.7.5

            - **修复弹窗按钮点不动（重要）**：之前弹窗用的是 NSAlert，而本应用没有 Dock 图标，
              macOS 14 起无法无条件抢焦点 —— 后台弹出的窗口第一次点击会被系统拿去「激活应用」而送不到按钮上，
              而且模态会话会一直挂着，导致设置面板等其它窗口也一起失去响应。
              现在所有弹窗/提示都换成自绘的非激活面板（nonactivatingPanel + 按钮接受首次点击、非模态），
              点一次就生效，也不会再把 App 卡住。
            - **录屏权限流程理顺，去掉来回弹窗**：点「申请授权」只申请权限本身，不再顺带弹出「修复权限」对话框
              （两个弹窗互相调用会来回循环）；「修复权限」只在点它时才执行：清记录 → 提示 → 重新申请一次。
              tccutil 移到后台线程执行，避免界面假死。
            - **手机遥控默认回到 HTTP**：读陀螺仪才需要 HTTPS，而自签证书在手机上必然先弹「证书不受信任」，
              所以默认用兼容性最好的 HTTP；需要陀螺仪时打开「陀螺仪模式（HTTPS）」开关即可。
            - **「刷新地址」修好了**：之前点它只刷新显示文字，并没有重新监听；现在会重新读局域网 IP 并换一个新口令。
            - 手机遥控面板精简：删掉「在本机打开 / 重新检测连接 / 打开本地网络设置」三个按钮，
              长说明收进可折叠的「使用说明 / 打不开时的排查」。

            ## v1.7.4

            - **下载提速：多源自动切换**。以前只从 GitHub 直链下载，国内网络经常超时（网络错误 -1001）。
              现在会依次尝试「GitHub 直连 → 5 个加速节点」，某个源 15 秒连不上就自动换下一个，
              全部走完还会整体重来一轮；进度文字里会显示当前用的是哪条通道。
              下载完还会校验文件头是不是 zip，防止加速节点返回错误页把 App 换坏。
            - **修复更新弹窗按钮点不动**：没有 Dock 图标的 App 在后台弹窗时，
              第一次点击会被系统拿去「尝试激活应用」而送不到按钮上，看起来就是怎么点都没反应。
              现在弹窗/进度框出现时会临时切换到普通 App 抢到焦点，弹完立刻切回菜单栏模式；
              「取消」按钮也改为接受首次点击。
            - **更新进度框右下角新增作者 logo 与 KDXZHX 署名**。

            ## v1.7.3

            - **手机遥控连不上时能直接看到卡在哪**：启动后自动自检「本机回环 + 局域网」两段路径，
              结论写在设置面板状态行；手机打不开时点「重新检测连接」即可复检。
              新增「打开本地网络设置」直达按钮 —— macOS 15 起不授权「本地网络」，手机就连不上 Mac。
            - **HTTPS 自检不通过会自动回退 HTTP**：避免手机端出现「打不开该网页，因为已丢失网络连接」。
            - **菜单栏图标从 20pt 缩到 18pt**，与旁边系统图标齐平。
            - **接入官网**：菜单栏、设置面板、更新弹窗都新增「打开官网」入口，统一指向 <https://kdxzhx.top/mackz>。

            ## v1.7.2

            - **手机陀螺仪铰链模式（新功能）**：没有 Lid Angle Sensor 的机型（如 MacBook Air）现在可以把手机
              竖着贴/绑在屏幕上，用手机姿态角模拟 MacBook 铰链开合 —— 手机页面点「启用陀螺仪」后，
              角度会以 20Hz 推给 Mac，直接驱动折叠动画；数据中断会自动交还本机传感器。
            - **手机遥控改走 HTTPS**：浏览器读取运动传感器必须处于安全上下文，因此服务会用系统自带的
              openssl 现场签一张含本机 IP 的自签证书（手机首次打开点「继续访问」即可），
              拿不到证书时自动回退 HTTP；同时把连接改为 keep-alive，避免 20Hz 上报反复做 TLS 握手。
            - **修复菜单栏图标两侧的黑边**：旧算法把等比缩放留下的透明留白（亮度 0）算成了不透明的黑色，
              表现为 logo 左右各挂一条黑边；现在只保留纯 logo 本身。
            - **更新弹窗不再被压住**：弹窗/进度窗层级统一提高到 3000（高于覆盖动画层与设置面板），
              并在模态期间二次压层 + 强制激活本应用，解决「弹窗老在下面」的问题。

